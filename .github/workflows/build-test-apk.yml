name: Build MRTT APK

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mrtt-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  ANDROID_NDK_VERSION: '28.2.13676358'

jobs:
  android-unit-tests:
    name: Android unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;36.0.0"
      - name: Run unit tests
        run: |
          chmod +x gradlew
          node scripts/test_max_webview_theme.cjs
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

  linux-server:
    name: Linux server assets
    needs: android-unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Restore server binaries for these exact sources
        id: native
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/mrtt-linux-*
            app/src/main/assets/mrtt.server-provenance.json
            rust-server/Cargo.lock
          key: server-v1-${{ runner.os }}-rust1.97.1-zig0.13-${{ hashFiles('rust-server/**', 'shared/**', 'scripts/server_asset_provenance.ps1') }}
      - uses: mlugg/setup-zig@v2
        if: steps.native.outputs.cache-hit != 'true'
        with:
          version: '0.13.0'
      - name: Install Rust
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
      - name: Restore Cargo dependencies and cross-compiler
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-zigbuild
            rust-server/build/linux-musl
          key: server-cargo-v1-${{ runner.os }}-${{ hashFiles('rust-server/Cargo.lock') }}-${{ hashFiles('rust-server/**/*.rs', 'shared/**') }}
          restore-keys: |
            server-cargo-v1-${{ runner.os }}-${{ hashFiles('rust-server/Cargo.lock') }}-
      - name: Install cross-compiler
        if: steps.native.outputs.cache-hit != 'true'
        run: command -v cargo-zigbuild || cargo install cargo-zigbuild --locked
      - name: Build server assets
        if: steps.native.outputs.cache-hit != 'true'
        run: bash rust-server/build_linux.sh --no-tests
      - name: Verify server provenance, including cache hits
        shell: pwsh
        run: ./scripts/server_asset_provenance.ps1 -Mode Verify
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-server
          path: |
            app/src/main/assets/mrtt-linux-*
            app/src/main/assets/mrtt.server-provenance.json
            rust-server/Cargo.lock
          if-no-files-found: error
          retention-days: 7

  android-client:
    name: Rust client (${{ matrix.abi }})
    needs: android-unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: true
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
            directory: arm64
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
            directory: armv7
          - abi: x86_64
            target: x86_64-linux-android
            directory: x86_64
    steps:
      - uses: actions/checkout@v6
      - name: Restore Rust client for these exact sources
        id: native
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs/${{ matrix.abi }}/libclient.so
            build/rust-client-android-${{ matrix.directory }}/${{ matrix.target }}/release/client
            rust-client/Cargo.lock
          key: client-v1-${{ runner.os }}-rust1.97.1-ndk28.2-${{ matrix.abi }}-${{ hashFiles('rust-client/**', 'shared/**', 'scripts/native_client_provenance.ps1') }}
      - uses: android-actions/setup-android@v4
        if: steps.native.outputs.cache-hit != 'true'
        with:
          packages: 'platform-tools'
      - name: Install NDK and Rust target
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add ${{ matrix.target }}
      - name: Restore Cargo dependencies and cross-compiler
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            build/rust-client-android-${{ matrix.directory }}
          key: client-cargo-v1-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('rust-client/Cargo.lock') }}-${{ hashFiles('rust-client/**/*.rs', 'shared/**') }}
          restore-keys: |
            client-cargo-v1-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('rust-client/Cargo.lock') }}-
      - name: Install cargo-ndk
        if: steps.native.outputs.cache-hit != 'true'
        run: command -v cargo-ndk || cargo install cargo-ndk --locked
      - name: Build Rust client
        if: steps.native.outputs.cache-hit != 'true'
        working-directory: rust-client
        run: |
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/build/rust-client-android-${{ matrix.directory }}" cargo ndk --platform 26 -t ${{ matrix.abi }} build --release
          mkdir -p ../app/src/main/jniLibs/${{ matrix.abi }}
          cp "$GITHUB_WORKSPACE/build/rust-client-android-${{ matrix.directory }}/${{ matrix.target }}/release/client" ../app/src/main/jniLibs/${{ matrix.abi }}/libclient.so
      - name: Verify ABI and source provenance
        shell: pwsh
        run: |
          ./scripts/native_client_provenance.ps1 -Mode Write -Abis '${{ matrix.abi }}'
          ./scripts/native_client_provenance.ps1 -Mode Verify -Abis '${{ matrix.abi }}'
      - uses: actions/upload-artifact@v4
        with:
          name: native-android-${{ matrix.abi }}
          path: |
            app/src/main/jniLibs/${{ matrix.abi }}/libclient.so
            build/rust-client-android-${{ matrix.directory }}/${{ matrix.target }}/release/client
            rust-client/Cargo.lock
          if-no-files-found: error
          retention-days: 7

  linux-exit-client:
    name: Linux client for cascades
    needs: android-unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.13.0'
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: Restore Cargo dependencies and cross-compiler
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-zigbuild
            rust-client/build/linux-exit
          key: exit-client-v1-${{ runner.os }}-${{ hashFiles('rust-client/Cargo.lock') }}-${{ hashFiles('rust-client/**/*.rs', 'shared/**') }}
          restore-keys: |
            exit-client-v1-${{ runner.os }}-${{ hashFiles('rust-client/Cargo.lock') }}-
      - name: Install cross-compiler
        run: command -v cargo-zigbuild || cargo install cargo-zigbuild --locked
      - name: Build client
        run: bash rust-client/build_linux_exit.sh
      - uses: actions/upload-artifact@v4
        with:
          name: native-exit-client
          path: app/src/main/assets/mrtt-exit-client-*
          if-no-files-found: error
          retention-days: 7

  android-test-apk:
    name: Build Android APK (VK + MAX)
    needs: [android-unit-tests, linux-server, android-client, linux-exit-client]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;36.0.0"
      - name: Download verified native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
      - name: Record and verify combined native provenance
        shell: pwsh
        run: |
          ./scripts/native_client_provenance.ps1 -Mode Write
          ./scripts/native_client_provenance.ps1 -Mode Verify
          ./scripts/server_asset_provenance.ps1 -Mode Verify
      - name: Setup signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mrtt-release.p12"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/mrtt-release.p12"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build optimized Android APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleMaxTest --no-daemon --stacktrace
      - name: Verify packaged native transports
        run: |
          python3 - <<'PY'
          import glob, zipfile
          apks = glob.glob('app/build/outputs/apk/maxTest/*universal*.apk')
          assert apks, 'Universal optimized MAX test APK not found'
          with zipfile.ZipFile(apks[0]) as apk:
              files = set(apk.namelist())
              for abi in ('arm64-v8a', 'armeabi-v7a', 'x86_64'):
                  assert f'lib/{abi}/libclient.so' in files, f'{abi} Rust client missing'
              for arch in ('amd64', 'arm64', 'armv7'):
                  assert f'assets/mrtt-linux-{arch}' in files, f'{arch} Linux server asset missing'
          print('All Rust client ABIs and Linux server assets found in APK')
          PY
      - name: Upload test APKs
        uses: actions/upload-artifact@v4
        with:
          name: MRTT-APKs
          path: app/build/outputs/apk/maxTest/*.apk
          if-no-files-found: error
          retention-days: 7
