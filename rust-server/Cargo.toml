[package]
name = "mrtt"
version = "2.5.0"
edition = "2024"
rust-version = "1.97.1"
license = "Unlicense"

[[bin]]
name = "mrtt"
path = "main.rs"

[features]
default = []
diagnostics = []

[dependencies]
aes = "0.9.2"
anyhow = "1.0"
async-trait = "0.1"
futures-util = "0.3"

axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tower-service = "0.3"
base64 = "0.22"
bytes = "1.12.1"
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
crossbeam-queue = "0.3.13"
ctr = "0.10.1"
dashmap = "6.1"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
hex = "0.4"
hkdf = "0.13.0"
hmac = "0.13.0"
libc = "0.2"
rand = { version = "0.8", features = ["small_rng"] }
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rusqlite = { version = "0.37", features = ["bundled"] }
aws-lc-rs = "1.18.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
slab = "0.4"
socket2 = "0.6"
subtle = "2.6"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "process", "io-util"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["io"] }
tun = "=0.8.14"
webrtc = { version = "0.21", default-features = false, features = ["runtime-tokio", "crypto-aws-lc-rs"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }

[target.'cfg(all(target_os = "linux", not(target_env = "musl")))'.dependencies]
snmalloc-rs = { version = "0.7.5", default-features = false, features = ["build_cc", "usewait-on-address"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
debug = false
incremental = false
overflow-checks = false
